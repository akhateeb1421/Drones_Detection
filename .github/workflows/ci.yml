name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      # Install only what the unit tests import — the full pyproject pulls
      # torch/ultralytics/transformers (gigabytes) that no test needs.
      - name: Install test dependencies
        run: |
          pip install \
            "fastapi>=0.110" "pydantic>=2.6" "pydantic-settings>=2.2" \
            "sqlalchemy>=2.0" "psycopg2-binary>=2.9" \
            "numpy>=1.26" "pandas>=2.2" "httpx>=0.27" \
            pytest pytest-asyncio
      - name: Run unit tests
        run: python -m pytest tests/ -v
